<svg viewBox="0 0 576 576" xmlns="http://www.w3.org/2000/svg">
  <rect width="576" height="576" fill="#f8f9fa"/>
  <g transform="translate(288, 288)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="280" fill="none" stroke="#0f4c81" stroke-width="16"/>
    
    <!-- Second ring - partial arc -->
    <path d="M -220,0 A 220,220 0 0,1 0,-220" fill="none" stroke="#0f4c81" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Third ring - partial arc -->
    <path d="M -160,0 A 160,160 0 0,1 155,-64" fill="none" stroke="#0f4c81" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Fourth ring -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#0f4c81" stroke-width="16"/>
    
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#0f4c81" stroke-width="16"/>
    
    <!-- Horizontal connectors -->
    <rect x="-280" y="-8" width="80" height="16" fill="#0f4c81"/>
    <rect x="200" y="-8" width="80" height="16" fill="#0f4c81"/>
    
    <!-- Left vertical segments -->
    <rect x="-108" y="-160" width="16" height="60" fill="#0f4c81"/>
    <rect x="-108" y="50" width="16" height="110" fill="#0f4c81"/>
    
    <!-- Right vertical segments -->
    <rect x="92" y="50" width="16" height="90" fill="#0f4c81"/>
    <rect x="200" y="-8" width="16" height="100" fill="#0f4c81"/>
    
    <!-- Bottom left segment -->
    <path d="M -180,-60 L -140,-110" stroke="#0f4c81" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Upper right segment -->
    <path d="M 140,120 L 240,180" stroke="#0f4c81" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
